<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetric Encryption Key Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #10b981;
            --primary-hover: #34d399;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing background circles */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0) 70%);
            filter: blur(40px);
            z-index: 1;
        }
        .glow-1 { top: 10%; left: 10%; }
        .glow-2 { bottom: 10%; right: 10%; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #f8fafc 0%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: var(--muted-text);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .input-group:hover, .input-group:focus-within {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .key-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary);
            word-break: break-all;
            text-align: left;
            user-select: all;
            margin-right: 12px;
            flex-grow: 1;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
            border: none;
            color: #0f172a;
            width: 100%;
            border-radius: 14px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.15);
            transition: all 0.2s ease;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.25);
            background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            opacity: 0;
        }

        .toast.show {
            bottom: 30px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="card">
        <h1>Key Passphrase Generator</h1>
        <p class="desc">Generate a secure cryptographic passphrase to encrypt user bot tokens inside your MongoDB registry.</p>

        <div class="input-group">
            <span class="key-display" id="key-field">Generating...</span>
            <button class="btn-copy" id="btn-copy" onclick="copyKey()">Copy Key</button>
        </div>

        <button class="btn-generate" onclick="generateNewKey()">Generate New Key</button>
    </div>

    <div class="toast" id="toast">Key copied to clipboard!</div>

    <script>
        function generatePassphrase(length) {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{}|;:,.<>?";
            const bytes = new Uint8Array(length);
            window.crypto.getRandomValues(bytes);
            let result = "";
            for (let i = 0; i < length; i++) {
                result += charset[bytes[i] % charset.length];
            }
            return result;
        }

        function generateNewKey() {
            const key = generatePassphrase(32);
            document.getElementById('key-field').textContent = key;
        }

        function copyKey() {
            const keyText = document.getElementById('key-field').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        // Generate key on load
        window.onload = generateNewKey;
    </script>
</body>
</html>
