version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-filestore-bot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME:-filestore}
      - OWNER_ID=${OWNER_ID}
      - ADMINS=${ADMINS}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - UPSTREAM_REPO=${UPSTREAM_REPO:-https://github.com/aquib4040/filestore.git}
      - UPSTREAM_BRANCH=${UPSTREAM_BRANCH:-main}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PORT=${PORT:-8080}
      - AUTO_DEL=${AUTO_DEL:-300}
      - DISABLE_BTN=${DISABLE_BTN:-false}
      - PROTECT=${PROTECT:-false}
      - CLONE_LIMIT=${CLONE_LIMIT:-3}
      - CLONE_ALLOW=${CLONE_ALLOW:-true}
      - FQDN=${FQDN}
    dns:
      - 8.8.8.8
      - 1.1.1.1
