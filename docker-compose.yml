version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-filestore-bot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - MONGO_URI=mongodb://db:27101/filestore
      - OWNER_ID=${OWNER_ID}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - UPSTREAM_REPO=${UPSTREAM_REPO:-https://github.com/aquib4040/filestore.git}
      - UPSTREAM_BRANCH=${UPSTREAM_BRANCH:-main}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PORT=8080
      - AUTO_DEL=300
    depends_on:
      - db

  db:
    image: mongo:latest
    container_name: go-filestore-mongodb
    restart: always
    ports:
      - "27101:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
